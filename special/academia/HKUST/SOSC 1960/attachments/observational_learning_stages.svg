<svg xmlns='http://www.w3.org/2000/svg' width='870' height='250' viewBox='0 0 870 250' role='img'>
<rect x='30' y='90' width='170' height='130' rx='8' fill='#fbd3a6' stroke='#1f3864' stroke-width='2'/><text x='115' y='128' font-family='Helvetica, Arial, sans-serif' font-size='20' font-weight='normal' font-style='normal' text-anchor='middle' fill='#5a5a5a'>1</text><text x='115' y='160' font-family='Helvetica, Arial, sans-serif' font-size='20' font-weight='bold' font-style='normal' text-anchor='middle' fill='#1f3864'>Attention</text><text x='115' y='186' font-family='Helvetica, Arial, sans-serif' font-size='13' font-weight='normal' font-style='normal' text-anchor='middle' fill='#5a5a5a'>the learner</text><text x='115' y='204' font-family='Helvetica, Arial, sans-serif' font-size='13' font-weight='normal' font-style='normal' text-anchor='middle' fill='#5a5a5a'>watches the model</text><line x1='202' y1='155' x2='220' y2='155' stroke='#c2410c' stroke-width='3'/><polygon points='231,155 220,159.95 220,150.05' fill='#c2410c'/><rect x='235' y='90' width='170' height='130' rx='8' fill='#e8eef7' stroke='#1f3864' stroke-width='2'/><text x='320' y='128' font-family='Helvetica, Arial, sans-serif' font-size='20' font-weight='normal' font-style='normal' text-anchor='middle' fill='#5a5a5a'>2</text><text x='320' y='160' font-family='Helvetica, Arial, sans-serif' font-size='20' font-weight='bold' font-style='normal' text-anchor='middle' fill='#1f3864'>Retention</text><text x='320' y='186' font-family='Helvetica, Arial, sans-serif' font-size='13' font-weight='normal' font-style='normal' text-anchor='middle' fill='#5a5a5a'>the behaviour is</text><text x='320' y='204' font-family='Helvetica, Arial, sans-serif' font-size='13' font-weight='normal' font-style='normal' text-anchor='middle' fill='#5a5a5a'>kept in memory</text><line x1='407' y1='155' x2='425' y2='155' stroke='#c2410c' stroke-width='3'/><polygon points='436,155 425,159.95 425,150.05' fill='#c2410c'/><rect x='440' y='90' width='170' height='130' rx='8' fill='#fbd3a6' stroke='#1f3864' stroke-width='2'/><text x='525' y='128' font-family='Helvetica, Arial, sans-serif' font-size='20' font-weight='normal' font-style='normal' text-anchor='middle' fill='#5a5a5a'>3</text><text x='525' y='160' font-family='Helvetica, Arial, sans-serif' font-size='20' font-weight='bold' font-style='normal' text-anchor='middle' fill='#1f3864'>Initiation</text><text x='525' y='186' font-family='Helvetica, Arial, sans-serif' font-size='13' font-weight='normal' font-style='normal' text-anchor='middle' fill='#5a5a5a'>the learner</text><text x='525' y='204' font-family='Helvetica, Arial, sans-serif' font-size='13' font-weight='normal' font-style='normal' text-anchor='middle' fill='#5a5a5a'>performs it</text><line x1='612' y1='155' x2='630' y2='155' stroke='#c2410c' stroke-width='3'/><polygon points='641,155 630,159.95 630,150.05' fill='#c2410c'/><rect x='645' y='90' width='170' height='130' rx='8' fill='#e8eef7' stroke='#1f3864' stroke-width='2'/><text x='730' y='128' font-family='Helvetica, Arial, sans-serif' font-size='20' font-weight='normal' font-style='normal' text-anchor='middle' fill='#5a5a5a'>4</text><text x='730' y='160' font-family='Helvetica, Arial, sans-serif' font-size='20' font-weight='bold' font-style='normal' text-anchor='middle' fill='#1f3864'>Motivation</text><text x='730' y='186' font-family='Helvetica, Arial, sans-serif' font-size='13' font-weight='normal' font-style='normal' text-anchor='middle' fill='#5a5a5a'>the learner</text><text x='730' y='204' font-family='Helvetica, Arial, sans-serif' font-size='13' font-weight='normal' font-style='normal' text-anchor='middle' fill='#5a5a5a'>repeats it</text><text x='430' y='70' font-family='Helvetica, Arial, sans-serif' font-size='15' font-weight='normal' font-style='italic' text-anchor='middle' fill='#c2410c'>each stage can fail on its own</text>
</svg>

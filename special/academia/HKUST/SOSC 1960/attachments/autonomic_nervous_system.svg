<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 630' width='900' height='630'>
<rect width='900' height='630' fill='#ffffff'/>
<text x='170' y='40' font-family='Helvetica, Arial, sans-serif' font-size='18' font-weight='bold' font-style='normal' text-anchor='middle' fill='#1f3864'>sympathetic branch</text><text x='170' y='62' font-family='Helvetica, Arial, sans-serif' font-size='13' font-weight='normal' font-style='normal' text-anchor='middle' fill='#5a5a5a'>prepares the body for action</text><text x='730' y='40' font-family='Helvetica, Arial, sans-serif' font-size='18' font-weight='bold' font-style='normal' text-anchor='middle' fill='#1f3864'>parasympathetic branch</text><text x='730' y='62' font-family='Helvetica, Arial, sans-serif' font-size='13' font-weight='normal' font-style='normal' text-anchor='middle' fill='#5a5a5a'>restores and holds equilibrium at rest</text><text x='450' y='74' font-family='Helvetica, Arial, sans-serif' font-size='15' font-weight='normal' font-style='normal' text-anchor='middle' fill='#5a5a5a'>organ</text><rect x='365' y='129' width='170' height='46' rx='6' fill='#ffffff' stroke='#1f3864' stroke-width='2'/><text x='450' y='157' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='bold' font-style='normal' text-anchor='middle' fill='#1a1a1a'>eyes</text><text x='348' y='148' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='normal' font-style='normal' text-anchor='end' fill='#1a1a1a'>Dilates pupil</text><text x='348' y='179' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' font-style='normal' text-anchor='end' fill='#5a5a5a'>more light to see by</text><text x='552' y='148' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='normal' font-style='normal' text-anchor='start' fill='#1a1a1a'>Contracts pupil</text><text x='552' y='179' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' font-style='normal' text-anchor='start' fill='#5a5a5a'>less light, finer detail</text><rect x='365' y='225' width='170' height='46' rx='6' fill='#ffffff' stroke='#1f3864' stroke-width='2'/><text x='450' y='253' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='bold' font-style='normal' text-anchor='middle' fill='#1a1a1a'>lungs</text><text x='348' y='244' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='normal' font-style='normal' text-anchor='end' fill='#1a1a1a'>Relaxes bronchi</text><text x='348' y='275' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' font-style='normal' text-anchor='end' fill='#5a5a5a'>more air per breath</text><text x='552' y='244' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='normal' font-style='normal' text-anchor='start' fill='#1a1a1a'>Constricts bronchi</text><text x='552' y='275' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' font-style='normal' text-anchor='start' fill='#5a5a5a'>resting air flow</text><rect x='365' y='321' width='170' height='46' rx='6' fill='#ffffff' stroke='#1f3864' stroke-width='2'/><text x='450' y='349' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='bold' font-style='normal' text-anchor='middle' fill='#1a1a1a'>heart</text><text x='348' y='331.5' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='normal' font-style='normal' text-anchor='end' fill='#1a1a1a'>Accelerates and</text><text x='348' y='348.5' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='normal' font-style='normal' text-anchor='end' fill='#1a1a1a'>strengthens heartbeat</text><text x='348' y='371' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' font-style='normal' text-anchor='end' fill='#5a5a5a'>blood to the muscles</text><text x='552' y='340' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='normal' font-style='normal' text-anchor='start' fill='#1a1a1a'>Slows heartbeat</text><text x='552' y='371' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' font-style='normal' text-anchor='start' fill='#5a5a5a'>energy saved</text><rect x='365' y='417' width='170' height='46' rx='6' fill='#ffffff' stroke='#1f3864' stroke-width='2'/><text x='450' y='436.5' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='bold' font-style='normal' text-anchor='middle' fill='#1a1a1a'>stomach and</text><text x='450' y='453.5' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='bold' font-style='normal' text-anchor='middle' fill='#1a1a1a'>intestines</text><text x='348' y='436' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='normal' font-style='normal' text-anchor='end' fill='#1a1a1a'>Inhibits activity</text><text x='348' y='467' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' font-style='normal' text-anchor='end' fill='#5a5a5a'>blood sent elsewhere</text><text x='552' y='436' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='normal' font-style='normal' text-anchor='start' fill='#1a1a1a'>Stimulates activity</text><text x='552' y='467' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' font-style='normal' text-anchor='start' fill='#5a5a5a'>food digested</text><rect x='365' y='513' width='170' height='46' rx='6' fill='#ffffff' stroke='#1f3864' stroke-width='2'/><text x='450' y='532.5' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='bold' font-style='normal' text-anchor='middle' fill='#1a1a1a'>blood vessels of</text><text x='450' y='549.5' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='bold' font-style='normal' text-anchor='middle' fill='#1a1a1a'>the internal organs</text><text x='348' y='532' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='normal' font-style='normal' text-anchor='end' fill='#1a1a1a'>Contracts vessels</text><text x='348' y='563' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' font-style='normal' text-anchor='end' fill='#5a5a5a'>blood pushed to muscle</text><text x='552' y='532' font-family='Helvetica, Arial, sans-serif' font-size='14' font-weight='normal' font-style='normal' text-anchor='start' fill='#1a1a1a'>Dilates vessels</text><text x='552' y='563' font-family='Helvetica, Arial, sans-serif' font-size='12' font-weight='normal' font-style='normal' text-anchor='start' fill='#5a5a5a'>organs run normally</text><text x='450' y='606' font-family='Helvetica, Arial, sans-serif' font-size='15' font-weight='normal' font-style='italic' text-anchor='middle' fill='#c2410c'>each branch acts on the same organs, in opposite directions</text>
</svg>

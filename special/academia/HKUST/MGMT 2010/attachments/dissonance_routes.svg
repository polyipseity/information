  <rect x="470.0" y="150.0" width="470.0" height="80.0" rx="10" fill="none" stroke="#1f6fb2" stroke-width="2"/>
  <text x="490.0" y="197.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a">2. add consonant cognitions</text>
  <line x1="310.0" y1="205.0" x2="470.0" y2="300.0" stroke="#4a4a4a" stroke-width="2"/>
  <rect x="470.0" y="260.0" width="470.0" height="80.0" rx="10" fill="none" stroke="#1f6fb2" stroke-width="2"/>
  <text x="490.0" y="307.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" fill="#1a1a1a">3. change a discrepant cognition</text>

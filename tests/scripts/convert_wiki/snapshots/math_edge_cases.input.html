<div class="mw-content-ltr mw-parser-output" lang="en" dir="ltr">
  <section>
    <h2><span id="Empty_alttext">Empty alttext</span></h2>
    <p>
      <span
        class="mwe-math-element mwe-math-element-inline"
        typeof="mw:Extension/math"
        data-mw='{"name":"math","attrs":{},"body":{"extsrc":""}}'
        ><span
          class="mwe-math-mathml-inline mwe-math-mathml-a11y"
          style="
            clip: rect(1px, 1px, 1px, 1px);
            overflow: hidden;
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
          "
          ><math
            xmlns="http://www.w3.org/1998/Math/MathML"
            alttext=""
          ></math></span
      ></span>
    </p>

    <h2><span id="Special_chars">Special chars</span></h2>
    <p>
      Math with backslash:
      <span
        class="mwe-math-element mwe-math-element-block"
        typeof="mw:Extension/math"
        data-mw='{"name":"math","attrs":{"display":"block"},"body":{"extsrc":"\\alpha + \\beta"}}'
        ><span
          class="mwe-math-mathml-display mwe-math-mathml-a11y"
          style="
            clip: rect(1px, 1px, 1px, 1px);
            overflow: hidden;
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
          "
          ><math
            xmlns="http://www.w3.org/1998/Math/MathML"
            display="block"
            alttext="{\displaystyle \alpha + \beta}"
            ><semantics
              ><mrow
                ><mi>&#x3B1;</mi><mo>+</mo><mi>&#x3B2;</mi></mrow
              ></semantics
            ></math
          ><img
            class="mwe-math-fallback-image-display mw-invert skin-invert"
            src="data:image/svg+xml;base64," /></span
      ></span>
    </p>
    <p>
      Math with braces:
      <span
        class="mwe-math-element mwe-math-element-block"
        typeof="mw:Extension/math"
        data-mw='{"name":"math","attrs":{"display":"block"},"body":{"extsrc":"\\frac{1}{2}"}}'
        ><span
          class="mwe-math-mathml-display mwe-math-mathml-a11y"
          style="
            clip: rect(1px, 1px, 1px, 1px);
            overflow: hidden;
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
          "
          ><math
            xmlns="http://www.w3.org/1998/Math/MathML"
            display="block"
            alttext="{\displaystyle {\frac {1}{2}}}"
            ><semantics
              ><mrow
                ><mfrac><mn>1</mn><mn>2</mn></mfrac></mrow
              ></semantics
            ></math
          ><img
            class="mwe-math-fallback-image-display mw-invert skin-invert"
            src="data:image/svg+xml;base64," /></span
      ></span>
    </p>

    <h2><span id="Inline_math">Inline math</span></h2>
    <p>
      Inline math
      <span
        class="mwe-math-element"
        typeof="mw:Extension/math"
        data-mw='{"name":"math","attrs":{},"body":{"extsrc":"E=mc^2"}}'
        ><span
          class="mwe-math-mathml-inline mwe-math-mathml-a11y"
          style="
            clip: rect(1px, 1px, 1px, 1px);
            overflow: hidden;
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
          "
          ><math
            xmlns="http://www.w3.org/1998/Math/MathML"
            alttext="{\displaystyle E=mc^{2}}"
            ><semantics
              ><mrow
                ><mi>E</mi><mo>=</mo><mi>m</mi
                ><msup><mi>c</mi><mn>2</mn></msup></mrow
              ></semantics
            ></math
          ><img
            class="mwe-math-fallback-image-inline mw-invert skin-invert"
            src="data:image/svg+xml;base64," /></span
      ></span>
      inside text.
    </p>

    <h2><span id="Trailing_punctuation">Trailing punctuation</span></h2>
    <p>
      Inline math with comma
      <span
        class="mwe-math-element"
        typeof="mw:Extension/math"
        data-mw='{"name":"math","attrs":{},"body":{"extsrc":"a"}}'
        ><span
          class="mwe-math-mathml-inline mwe-math-mathml-a11y"
          style="
            clip: rect(1px, 1px, 1px, 1px);
            overflow: hidden;
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
          "
          ><math
            xmlns="http://www.w3.org/1998/Math/MathML"
            alttext="{\displaystyle a}"
            ><semantics
              ><mrow><mi>a</mi></mrow></semantics
            ></math
          ><img
            class="mwe-math-fallback-image-inline mw-invert skin-invert"
            src="data:image/svg+xml;base64," /></span></span
      >, and inline math with period
      <span
        class="mwe-math-element"
        typeof="mw:Extension/math"
        data-mw='{"name":"math","attrs":{},"body":{"extsrc":"b"}}'
        ><span
          class="mwe-math-mathml-inline mwe-math-mathml-a11y"
          style="
            clip: rect(1px, 1px, 1px, 1px);
            overflow: hidden;
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
          "
          ><math
            xmlns="http://www.w3.org/1998/Math/MathML"
            alttext="{\displaystyle b}"
            ><semantics
              ><mrow><mi>b</mi></mrow></semantics
            ></math
          ><img
            class="mwe-math-fallback-image-inline mw-invert skin-invert"
            src="data:image/svg+xml;base64," /></span></span
      >.
    </p>

    <h2><span id="Greek_and_unicode">Greek and unicode</span></h2>
    <p>
      Greek letters inline:
      <span
        class="mwe-math-element"
        typeof="mw:Extension/math"
        data-mw='{"name":"math","attrs":{},"body":{"extsrc":"\\Delta + \\theta"}}'
        ><span
          class="mwe-math-mathml-inline mwe-math-mathml-a11y"
          style="
            clip: rect(1px, 1px, 1px, 1px);
            overflow: hidden;
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
          "
          ><math
            xmlns="http://www.w3.org/1998/Math/MathML"
            alttext="{\displaystyle \Delta + \theta}"
            ><semantics
              ><mrow
                ><mi mathvariant="normal">&#x394;</mi><mo>+</mo
                ><mi>&#x3B8;</mi></mrow
              ></semantics
            ></math
          ><img
            class="mwe-math-fallback-image-inline mw-invert skin-invert"
            src="data:image/svg+xml;base64," /></span
      ></span>
    </p>
  </section>
</div>
